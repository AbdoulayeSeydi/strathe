name: Regression Tests

# NOTE: this CI setup only runs tests that don't need HoloOcean itself
# (which has no PyPI distribution and can't be installed here - see
# README.md's Setup section). test_dynamics_regressions.py is pure math,
# no simulator needed, so this works correctly for it. Any future test
# requiring a real HoloOcean environment would need a different setup
# (e.g. a self-hosted runner with HoloOcean pre-installed), not this one.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The public BlueROV2 dataset, pinned, so tests that validate against
      # real logs (thruster model, ingestion round-trip) run in CI instead of
      # skipping. ~230 MB.
      - name: Fetch BlueROV2 dataset
        run: |
          git init data/raw/Bluerov2_trajectory_dataset
          git -C data/raw/Bluerov2_trajectory_dataset fetch --depth 1 https://github.com/oceansystemslab/Bluerov2_trajectory_dataset.git 5104d15d2f9756ff45b4b0ed2b95d284a6e30e43
          git -C data/raw/Bluerov2_trajectory_dataset checkout FETCH_HEAD
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run regression suite
        working-directory: calibration
        run: pytest tests/ -v
      # The fleet workflow (MuJoCo, comm channel, two-agent env) is what
      # labs actually run, and tests/ never imports it -- which let
      # modules it depends on go uncommitted without CI noticing.
      - name: Run fleet test suite
        working-directory: calibration
        run: >
          pytest -v
          test_comm_channel.py test_experiment_schema.py
          test_formation_hold_task.py test_two_agent_formation_env.py
          test_two_agent_orchestrator.py test_mujoco_backend.py
          test_mlflow_fleet_schema.py test_track_b_config.py
          test_data_split.py test_phase2_config.py
          test_mujoco_arena_core.py
      - name: Fleet experiment smoke run (lab entry point)
        working-directory: calibration
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python run_fleet_experiment.py --config ci_smoke_experiment.yaml
      - name: Fleet smoke run, clean and noisy side by side, with a buoyancy change
        working-directory: calibration
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python ../strathe.py fleet --config ci_smoke_experiment.yaml --mode both --buoyancy -2 2 --name ci_noisy_smoke
      - name: Fleet smoke run with the measured open-water sensor noise and a perfect starting fix
        working-directory: calibration
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python ../strathe.py fleet --config ci_smoke_experiment.yaml --mode noisy --noise open_water --start-fix-error 0 --name ci_open_water_smoke
      - name: Fleet smoke run with acoustic, optical and hybrid links, and cones against omni terminals
        working-directory: calibration
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python ../strathe.py fleet --config ci_smoke_experiment.yaml --link acoustic optical hybrid --optical-water harbor --optical-terminals fore_aft_cones --optical-compare-omni --name ci_optical_smoke
