schema_version: "0.3.0"

metadata:
  description: >
    BlueROV2 Heavy (8-thruster) vehicle spec for the Strathe
    calibration pipeline. Separates MEASURED/PUBLISHED constants
    (fixed_parameters) from UNKNOWN physical parameters the optimizer
    solves for (calibration_targets). Every value carries source +
    confidence so provenance isn't lost months later.

# Explicit, named assumptions — so nobody has to guess what was silently
# baked in, and reviewers don't have to wonder "did they forget this?"
assumptions:
  - "Added mass matrix is diagonal — off-diagonal added-mass coupling assumed negligible."
  - "CG/CB offset only modeled in z — x=y=0 assumed (no known lateral CG/CB asymmetry)."
  - "The CALIBRATION logs were recorded in still water (a tank/pool), so environment.current below is zero. Open-water logs recorded in a known current: set it here or pass run_calibration.py --current-world-mps. Simulated currents for fleet and single-vehicle experiments are configured per experiment (current: in the experiment YAML), not here. See PROJECT_STATUS.md #55."
  - "The calibration reads body-frame forces (Fx..Tz). Logs with only thruster PWM are converted by data_ingestion.py + thruster_model.py (curve, direction, allocation; BlueROV2 Heavy preset or your own layout) before calibration. Thruster lag and battery sag are NOT modelled, and the thruster model is not itself calibrated (see thruster_model.calibrated: false). The simulators can limit commands to what the thrusters deliver (thrusters: in experiment YAMLs)."
  - "Payload is the vehicle's baseline configuration — no additional payload mass/CG shift modeled. See payload section."
  - "Linear (Xu) vs quadratic (Xuu) damping identifiability varies by axis — confirmed via two independent measurements to be a data-coverage issue for some axes (Xu/Xuu, Yv/Yvv) but likely a missing-physics symptom for others (Mq/Mqq) — see validation.identifiability_note."
  - "Dataset sampling rate is 10Hz — empirically determined (the dataset has no time column), NOT the 50Hz used in earlier calibration runs. See check_sampling_rate_windowed.py and PROJECT_STATUS.md finding #11 for the full validation (synthetic ground-truth recovery, drift-bias stress test, cross-date agreement, split-half reproducibility, per-run outlier screening, and round-number-duration confirmation). run_calibration.py's --sampling-rate-hz now defaults to 10.0 accordingly."

vehicle:
  name: bluerov2_heavy

# How the LOGS express the vehicle's wrench, as opposed to the physics
# being calibrated. Applied when logs are loaded (objective.DatasetConfig);
# run_calibration.py --torque-reference-offset-m overrides it.
data_conventions:
  torque_reference_offset_m: [0.0, 0.0, -0.085]
  torque_reference_rationale: >
    The reference dataset (and thruster_model.BLUEROV2_HEAVY_ALLOCATION,
    which reproduces it) takes torques about a point 8.5 cm below the
    horizontal thrusters, so every surge/sway command also logs a
    pitch/roll torque (logged Ty -0.98 correlated with Fx, Tx +0.95 with
    Fy). The dynamics model has no drag moment to balance it and predicted
    large pitch/roll the real vehicle doesn't show. Re-expressing the
    torques about the thruster plane lifted held-out roll/pitch skill from
    -0.49/-0.84 to about zero with no cost on other axes
    (PROJECT_STATUS.md #50). Set to [0, 0, 0] if your logs already give
    torques about the point your drag acts through. The reference dataset is
    in ROS FLU (z up), so -0.085 is below the thrusters there; logs ingested
    with the bluerov2_heavy preset are FRD and record +0.085 (#62).
  source: "measured from the dataset's own allocation matrix and logs"
  confidence: measured

environment:
  # The water current during the CALIBRATION recordings, in the logs' world
  # frame: horizontal speed, the direction it flows toward (degrees from the
  # world x axis toward +y), and vertical flow (+ down). Used by
  # run_calibration.py unless --current-world-mps overrides it.
  current_velocity_mps: 0.0
  current_direction_deg: 0.0
  current_vertical_mps: 0.0
  source: "assumed — dataset collected in tank/pool, not open water"
  confidence: assumed
  note: >
    For open-water logs, measure the current (ADCP, or DVL water-track vs
    bottom-track) and set it here. A current that varies within a
    recording, or an unknown one, would need to become a per-run
    calibration target, which isn't built yet.

payload:
  description: "Baseline vehicle configuration, no additional payload."
  additional_mass_kg: 0.0
  note: >
    Payload changes mass, buoyancy, CG, and CB simultaneously. A future
    revision should model payload as a structured addition that
    propagates to all four together, not just mass alone.

thruster_model:
  calibrated: false
  count: 8
  hardware: "Blue Robotics T200"
  source: "Blue Robotics published spec sheet"
  confidence: published
  note: >
    Thruster-level dynamics (deadband, time constant, saturation,
    nonlinear thrust curve) are NOT calibrated in this MVP — the dataset
    already provides pre-converted net forces/torques (Fx..Tz). If a
    future dataset provides only raw PWM, this section becomes real
    calibration targets — see future_calibration_targets below.
  future_calibration_targets:
    deadband_pwm: null
    time_constant_s: null
    max_forward_n: null
    max_reverse_n: null
    polynomial_coefficients: null

# ---------------------------------------------------------------------------
# FIXED PARAMETERS — measured/published constants. NOT touched by the
# optimizer.
# ---------------------------------------------------------------------------
fixed_parameters:
  mass_kg:
    value: 11.2
    unit: kg
    source: "Blue Robotics published spec (BlueROV2 Heavy, standard config)"
    confidence: published

# ---------------------------------------------------------------------------
# CALIBRATION TARGETS — unknowns the optimizer solves for. Every entry
# carries unit, initial_guess, bounds, bounds_rationale, and provenance.
# ---------------------------------------------------------------------------
calibration_targets:

  effective_inertia:
    # REPARAMETERIZED (was inertia_diag: Ixx/Iyy/Izz, separate from
    # Kp_dot/Mq_dot/Nr_dot in added_mass_diag below). diagnose_calibration.py's
    # Jacobian-based identifiability analysis on the real BlueROV2 dataset
    # found Izz and Nr_dot correlated at EXACTLY -1.000 — not just
    # difficult to separate, but mathematically impossible to separate
    # from velocity-only data, because they only ever appear as a SUM
    # (Izz + Nr_dot) in the dynamics. Confirmed algebraically (not just
    # inferred from the correlation) that roll and pitch have the
    # identical structure. All three axes were collapsed into single
    # effective-inertia parameters. See dynamics_model.py's "Structural
    # non-identifiability" docstring section for the full writeup.
    #
    # Bounds are NOT simply the sum of the old Ixx/Kp_dot bounds — the
    # first calibration run pinned BOTH Ixx and Kp_dot to their old upper
    # bounds simultaneously, meaning the effective sum was already sitting
    # at the naive combined bound (0.40+2.0=2.4). Using that same 2.4 as
    # the new upper bound would just reproduce the same saturation and
    # tell us nothing new — widened to 5.0 to actually test whether the
    # true effective value is higher than the old constrained pair could
    # reach.
    Ieff_roll:  {unit: "kg*m^2", initial_guess: 0.26, bounds: [0.255, 0.265],
                 bounds_rationale: "FIXED near the real, independently-sourced BlueROV2 heavy-config value (0.26 kg*m^2, clydemcqueen/bluerov2_gz public Gazebo model) after two convergent findings (PROJECT_STATUS.md): (1) a sensitivity sweep showed near-ZERO RMSE sensitivity to this parameter's exact value, (2) a real re-fit with it fixed at this value lost none of the fit quality (cost still dropped ~97% with the other 20 parameters doing the work). Previous wide bounds let it drift to a non-physical 9-10 kg*m^2 with no real fit-quality justification - likely compensating for something else rather than reflecting genuine inertia. Bounds kept narrow-but-nonzero (not exactly equal) to avoid a real x_scale=ub-lb=0 division risk, confirmed directly before this change.",
                 source: "independently-sourced real BlueROV2 heavy-config value (clydemcqueen/bluerov2_gz)", confidence: literature}
    Ieff_pitch: {unit: "kg*m^2", initial_guess: 0.23, bounds: [0.225, 0.235],
                 bounds_rationale: "FIXED near the real, independently-sourced BlueROV2 heavy-config value (0.23 kg*m^2, clydemcqueen/bluerov2_gz public Gazebo model) - same reasoning as Ieff_roll above (near-zero RMSE sensitivity confirmed two ways; the earlier 9-10 kg*m^2 drift was not fit-quality-justified).",
                 source: "independently-sourced real BlueROV2 heavy-config value (clydemcqueen/bluerov2_gz)", confidence: literature}
    Ieff_yaw:   {unit: "kg*m^2", initial_guess: 0.32, bounds: [0.05, 10.0],
                 bounds_rationale: "deliberately wider than the old Izz+Nr_dot combined bound (2.4), which is where the ORIGINAL calibration run pinned this exact quantity — see note above",
                 source: "sum of box-approximation inertia + literature added-mass estimate", confidence: estimated}

  linear_damping:
    # Upper bounds changed from 0 to a small negative value (see
    # find_min_stable_damping.py) — CONFIRMED via direct empirical test,
    # not assumed: allowing EXACTLY zero damping on any axis lets
    # perturbed-initialization optimizer starts (see optimizer.py's
    # "perturbed" strategy) land on a physically nonsensical "zero drag"
    # state that is genuinely, not just numerically, unstable once
    # Coriolis terms are active — with truly zero damping, nothing
    # dissipates the energy Coriolis correctly transfers into that axis
    # from others, so it grows unboundedly (confirmed: stable at 0.5% of
    # the lower bound's magnitude, unstable ONLY at exact 0 — a sharp
    # cliff, not a gradual degradation). New upper bounds set at 2% of
    # each parameter's own lower bound — a confirmed 4x safety margin
    # beyond the empirically-tested stable point, while leaving the vast
    # majority of each range available (real calibration has always
    # converged toward the STRONG/lower-bound end anyway — see
    # PROJECT_STATUS.md finding #12).
    Xu:  {unit: "N/(m/s)", initial_guess: -11.7, bounds: [-50, -1.0],
          bounds_rationale: "~5x nominal literature estimate; upper bound excludes near-zero damping, see comment above",
          source: "Fossen-style BlueROV2 sysID literature", confidence: literature}
    Yv:  {unit: "N/(m/s)", initial_guess: -20.0, bounds: [-80, -1.6],
          bounds_rationale: "~4x nominal literature estimate; upper bound excludes near-zero damping, see comment above",
          source: "Fossen-style BlueROV2 sysID literature", confidence: literature}
    Zw:  {unit: "N/(m/s)", initial_guess: -31.8, bounds: [-100, -2.0],
          bounds_rationale: "~3x nominal literature estimate; upper bound excludes near-zero damping, see comment above",
          source: "Fossen-style BlueROV2 sysID literature", confidence: literature}
    Kp:  {unit: "N*m/(rad/s)", initial_guess: -0.3, bounds: [-10, -0.1],
          bounds_rationale: "widened lower bound from -5 to -10 — CONFIRMED pinned exactly at -5 (check_p_bounds.py, 0.1% from bound) in the same real calibration where roll rate remained stuck; the model wants STRONGER roll damping than previously allowed. Upper bound still excludes near-zero damping, see comment above",
          source: "literature", confidence: literature}
    Mq:  {unit: "N*m/(rad/s)", initial_guess: -0.3, bounds: [-5, -0.1],
          bounds_rationale: "wide net — low-confidence axis, sparse published data; upper bound excludes near-zero damping, see comment above",
          source: "literature", confidence: literature}
    Nr:  {unit: "N*m/(rad/s)", initial_guess: -1.0, bounds: [-10, -0.2],
          bounds_rationale: "wide net — low-confidence axis, sparse published data; upper bound excludes near-zero damping, see comment above",
          source: "literature", confidence: literature}

  quadratic_damping:
    Xuu: {unit: "N/(m/s)^2", initial_guess: -18.2, bounds: [-100, -2.0],
          bounds_rationale: "~5x nominal literature estimate; upper bound excludes near-zero damping, see linear_damping comment", source: "literature", confidence: literature}
    Yvv: {unit: "N/(m/s)^2", initial_guess: -21.7, bounds: [-100, -2.0],
          bounds_rationale: "~5x nominal literature estimate; upper bound excludes near-zero damping, see linear_damping comment", source: "literature", confidence: literature}
    Zww: {unit: "N/(m/s)^2", initial_guess: -50.0, bounds: [-150, -3.0],
          bounds_rationale: "~3x nominal literature estimate; upper bound excludes near-zero damping, see linear_damping comment. UPDATE: post-Coriolis real fit shows Zw/Zww correlation at -0.826 (was -0.88 pre-Coriolis) vs. the fixed kinematic baseline of 0.918 (see identifiability_note below) - the gap from baseline WIDENED (0.038 -> 0.092) after adding Coriolis, the opposite of what would be expected if Coriolis were resolving a missing-physics-driven inflation the way it was hoped to for Mq/Mqq. This pair's correlation looks like a genuine data-coverage issue, not a missing-physics symptom.",
          source: "literature", confidence: literature}
    Kpp: {unit: "N*m/(rad/s)^2", initial_guess: -0.5, bounds: [-10, -0.2],
          bounds_rationale: "wide net — low-confidence axis; upper bound excludes near-zero damping, see linear_damping comment", source: "literature", confidence: literature}
    Mqq: {unit: "N*m/(rad/s)^2", initial_guess: -0.5, bounds: [-10, -0.2],
          bounds_rationale: "wide net — low-confidence axis; upper bound excludes near-zero damping, see linear_damping comment", source: "literature", confidence: literature}
    Nrr: {unit: "N*m/(rad/s)^2", initial_guess: -2.0, bounds: [-30, -0.4],
          bounds_rationale: "wide net — low-confidence axis; upper bound excludes near-zero damping, see linear_damping comment. UPDATE: post-Coriolis real fit shows Nr/Nrr correlation at -0.861 vs. the fixed kinematic baseline of 0.864 (see identifiability_note below) - gap 0.003, the TIGHTEST match of any damping pair (was 0.006 pre-Coriolis, already small). Not bound-pinned in the current real result either. Clean, confirmed data-coverage case - no missing-physics symptom here.",
          source: "literature", confidence: literature}

  added_mass_diag:
    # Off-diagonal added-mass coupling — surge-pitch (Xq_dot) and heave-
    # pitch (Zq_dot) below — NO LONGER assumed negligible (see
    # PROJECT_STATUS.md finding #22): a pure-kinematics check of real
    # logged data confirmed all six Coriolis-relevant velocity products
    # are well-excited (under a 5x spread across all of them), ruling out
    # a data-coverage explanation for the remaining rotational-DOF
    # weakness and pointing at genuine missing model structure instead —
    # this is the first, most physically-motivated candidate (BlueROV2's
    # real vertical/top-bottom asymmetry, the SAME asymmetry
    # cg_cb_offset_z already models for the restoring force). Port-
    # starboard couplings (sway-roll, sway-yaw) are NOT added here — the
    # vehicle is reasonably left-right symmetric, so those remain assumed
    # negligible.
    # NOTE: rotational added mass (was Kp_dot/Mq_dot/Nr_dot here) moved to
    # effective_inertia above — see the reparameterization note there.
    Xu_dot: {unit: kg, initial_guess: 5.5, bounds: [0, 30],
             bounds_rationale: "~5x nominal literature estimate", source: "literature", confidence: literature}
    Yv_dot: {unit: kg, initial_guess: 12.7, bounds: [0, 40],
             bounds_rationale: "~3x nominal literature estimate", source: "literature", confidence: literature}
    Zw_dot: {unit: kg, initial_guess: 14.6, bounds: [0, 40],
             bounds_rationale: "~3x nominal literature estimate. UPDATE (PROJECT_STATUS.md finding #18): pinning at the lower bound in real fits is CONFIRMED a genuine practical (data-coverage) identifiability gap, not a modeling bug - two independent methods (Jacobian-based sensitivity analysis, and an SVD-based multi-parameter near-null-space check) both concluded this dataset's real maneuvers do not sufficiently excite heave acceleration to constrain this parameter. Bounds/initial_guess deliberately left unchanged - there is no fit-quality or physical basis to move them, unlike Ieff_roll/Ieff_pitch's later, different situation.",
             source: "literature", confidence: literature}

  added_mass_coupling:
    # Bounds are NOT arbitrary — mathematically derived to GUARANTEE the
    # mass matrix stays positive-definite (a real physical requirement,
    # checked at runtime too via Cholesky — see dynamics_model.py) even
    # at the worst-case combination of the OTHER bounded parameters
    # (smallest possible Ieff_pitch=0.05, smallest possible Xu_dot/Zw_dot=0):
    # sqrt(worst_case_M00 * worst_case_M44) ~= 0.748 for both couplings.
    # [-0.5, 0.5] is comfortably inside that, with real margin, not
    # right at the edge.
    Xq_dot: {unit: kg, initial_guess: 0.0, bounds: [-0.5, 0.5],
             bounds_rationale: "no prior literature estimate for this vehicle; bound is set by the mass-matrix positive-definiteness requirement, not a physical magnitude estimate",
             source: "assumed near-zero, exploratory", confidence: assumed}
    Zq_dot: {unit: kg, initial_guess: 0.0, bounds: [-0.5, 0.5],
             bounds_rationale: "no prior literature estimate for this vehicle; bound is set by the mass-matrix positive-definiteness requirement, not a physical magnitude estimate",
             source: "assumed near-zero, exploratory", confidence: assumed}

  buoyancy:
    # x=y=0 assumed for CG/CB offset (see assumptions) — only z calibrated.
    net_buoyancy_z: {unit: N, initial_guess: 0.0, bounds: [-1.0, 1.0],
                      bounds_rationale: "TIGHTENED from [-10,10] - CONFIRMED (PROJECT_STATUS.md): real sensitivity sweep showed near-ZERO RMSE sensitivity to this parameter (tied for lowest of all 22 parameters), AND a real re-fit with it fixed at 0.0 (this file's own original neutral-trim prior) lost none of the fit quality (cost still dropped ~97% with the other 21 parameters doing the work). The old wide bound let it drift to the extreme +10N edge (~1kg of trim) with no fit-quality justification - the same non-load-bearing-drift pattern already confirmed and fixed for Ieff_roll/Ieff_pitch. New bounds still allow +-1N (~0.1kg) of real trim variation, comfortably wider than a well-trimmed vehicle should need.",
                      source: "assumed near-neutral trim, confirmed non-load-bearing", confidence: assumed}
    cg_cb_offset_z: {unit: m, initial_guess: 0.02, bounds: [-0.1, 0.1],
                      bounds_rationale: "±10cm exceeds any plausible BlueROV2 hull offset — deliberately generous",
                      source: "assumed small positive (CG below CB, passively stable)", confidence: assumed}

# ---------------------------------------------------------------------------
# OPTIMIZATION CONFIG — currently informational; optimizer.py still
# hardcodes the actual least_squares() call. Worth wiring this section up
# to actually drive that call in a later pass, so changing strategy
# doesn't require editing Python.
# ---------------------------------------------------------------------------
optimization:
  algorithm: "scipy.optimize.least_squares (trust region reflective)"
  loss: "linear (standard least-squares residuals)"
  ftol: 1.0e-8

# ---------------------------------------------------------------------------
# VALIDATION — what "good" looks like, documented alongside the spec
# rather than buried in code.
# ---------------------------------------------------------------------------
validation:
  primary_metric: "mean per-run RMSE across all 6 velocity DOFs (Bu,Bv,Bw,Bp,Bq,Br)"
  identifiability_note: >
    CONFIRMED via TWO INDEPENDENT measurements, and the comparison between
    them is more informative than either alone. (1) Jacobian-based
    correlation from the fitted model, on real data (v0.2.0-0.3.0
    calibration): Xu/Xuu -0.93, Mq/Mqq -0.93, Yv/Yvv -0.92, Zw/Zww -0.88,
    Nr/Nrr -0.87, Kp/Kpp -0.84. (2) Pure kinematic correlation of corr(v,
    v*|v|) using ONLY the real logged velocity distribution, independent
    of any model or optimizer (check_damping_identifiability.py): Xu/Xuu
    0.948, Zw/Zww 0.918, Yv/Yvv 0.887, Nr/Nrr 0.864, Kp/Kpp 0.795, Mq/Mqq
    0.764.
    For Xu/Xuu and Yv/Yvv, the two measures agree closely — CONFIRMS the
    "narrow speed range" mechanism is real and dominant for these axes.
    For Mq/Mqq specifically, they sharply DISAGREE: it's the 2nd-worst
    pair by the fitted-model measure but the LEAST severe by pure velocity
    kinematics. That gap means data coverage alone does not explain
    Mq/Mqq's correlation — something else is inflating it. Given the
    separately-documented finding that pitch shows the model's clearest
    missing-rotational-physics symptoms (force-breakdown plots showing
    damping compensating for absent Coriolis/cross-coupling terms; see
    PROJECT_STATUS.md), the working hypothesis is that Mq/Mqq's
    correlation is a SYMPTOM of that same missing-physics problem, not an
    independent data-coverage issue — i.e. the optimizer is using both
    damping terms jointly as compensation, not just failing to tell them
    apart. This should resolve (or at least change) once the stand-in
    model is replaced with HoloOcean's real dynamics — worth explicitly
    re-running this same two-measurement comparison after that swap to see
    whether Mq/Mqq's fitted-model correlation drops toward its kinematic
    baseline (0.764) once real Coriolis/cross-coupling terms are present.
    Zw/Zww and Kp/Kpp show milder versions of the same disagreement (2-rank
    shifts each) — worth watching too, not just Mq/Mqq.
    UPDATE, post-Coriolis (real diagnostic run, PROJECT_STATUS.md): Zw/Zww's
    fitted correlation is now -0.826 (was -0.88), vs. its fixed kinematic
    baseline of 0.918. The gap from baseline WIDENED (0.038 -> 0.092), the
    OPPOSITE of what Coriolis resolving a missing-physics inflation would
    predict — Zw/Zww looks like genuine data-coverage, not a missing-physics
    symptom, unlike the open Mq/Mqq question above. Not yet re-checked for
    Mq/Mqq itself with this same before/after comparison.
    Regardless of mechanism: NOT exact ±1.000 correlations like Izz/Nr_dot
    was — genuinely difficult to separate, not proven structurally
    impossible. Treat each pair's INDIVIDUAL values with real skepticism;
    the pair's combined behavior is more trustworthy than either value
    alone.