# default_experiment.yaml -- shipped default fleet experiment config.
# Run with: python run_fleet_experiment.py  (uses this file automatically)
# Or specify your own: python run_fleet_experiment.py --config my_experiment.yaml
#
# Copy this file and edit it to define your own experiment -- no source
# edits needed. See comments on each field for what's configurable.
#
# IMPORTANT: the two vehicles below are assigned roles by position, not by
# name. The first vehicle is treated as "calibrated" (uses real fitted
# physics), the second as "generic" (uses default physics). The labels
# below are just for the report -- they don't change which parameters each
# agent uses.

name: "fleet_baseline_sweep"  # appears in MLflow and the summary report

vehicles:
  # NOTE ON HOW MODELS ARE USED: run_fleet_experiment.py currently uses
  # vehicles[0] as the centralized policy controlling BOTH agents in the
  # sweep. vehicles[1] is loaded and validated (pre-flight shape check)
  # but does not affect the sweep output. Both agents' PHYSICS are always
  # one calibrated + one generic, set by the environment -- independent
  # of which policies are listed here.
  #
  # For the default to show a meaningful delta_physics_belief_error at L2,
  # vehicles[0] must be the L2-trained policy (curriculum_L2), not the
  # L0-trained one (curriculum_v5). An L0-trained policy at L2 severity
  # produces near-zero delta because it doesn't exploit calibrated physics
  # under degraded comm. See README for the full explanation.

  - model_path: formation_hold_ppo_curriculum_L2  # L2-trained: shows the Claim C signal
    algorithm: ppo
    role: calibrated   # human-readable label only -- physics are set by the environment

  - model_path: formation_hold_ppo_curriculum_v5  # L0-trained: loaded+validated, not used in sweep
    algorithm: ppo
    role: generic

communication:
  severity: L2         # base severity level: L0, L1, L2, L3a, or L3b
                       # See README for what each level means numerically.
  # overrides:         # optional: change any individual comm parameter on top
  #   near_field_prob: 0.4   # override packet drop probability
  #   far_field_prob: 0.4
  #   bytes_per_tick: 23     # override bandwidth limit
  #   speed_of_sound_mps: 1500.0  # override acoustic latency model

task:
  target_separation_m: 2.0   # target distance between agents (meters)
  tolerance_m: 0.2            # how close to target counts as "in formation"
  hold_steps: 20              # how many consecutive steps must be held for success

evaluation:
  episodes: 160               # total episodes per cell (32 grid points × 5 seeds = 160)
  comm_seeds: [1, 2, 3, 4, 5] # RNG seeds for the comm channel (averaged over in output)
  grid_seeds: 5               # episode seeds per grid point

# dynamics_backend: which physics engine to use for evaluation.
# "stand_in": fast, default (the same backend used for training)
# "mujoco": validated MuJoCo dynamics (slower, but independent physics engine)
# "both": run on stand_in first, then re-run on mujoco (takes 2x the time)
dynamics_backend: stand_in

output_dir: results/fleet_baseline_sweep  # all CSVs, metrics, and the report go here

# Expected runtime (stand_in backend, comm_seeds=5, grid_seeds=5):
#   ~7 minutes per severity level on a modern laptop (M-series Mac or similar)
# "both" backend doubles that. MuJoCo adds roughly 20-30% overhead per cell.
