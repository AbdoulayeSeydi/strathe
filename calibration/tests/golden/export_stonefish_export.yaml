axis_verdict_10s:
  better:
  - forward speed (surge)
  - sideways speed (sway)
  - up/down speed (heave)
  worse:
  - roll
  - pitch
  - heading (yaw)
  same: []
recommendation: 'Strathe''s values are not a calibrated Stonefish model: they balance
  against Strathe''s own drag and righting, not Stonefish''s. Its mesh drag grows
  with speed cubed and couples the axes (surge), and its roll and pitch damping come
  from the same mesh coefficients, so a transplanted centre of gravity no longer balances
  them (roll, pitch). To calibrate your Stonefish model, run `strathe fit-stonefish`,
  which fits it through Stonefish itself (on URI''s ALPHA RISE: 53-66% less error
  after 60 s, against 17-28% for this conversion; PROJECT_STATUS.md #73-#75).'
