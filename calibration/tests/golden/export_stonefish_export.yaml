- 'Drag converted, not carried: Stonefish''s mesh drag grows with speed cubed and
  couples the axes, and its rotational drag comes from the same coefficients over
  the part''s mesh. Stonefish built with calibration/stonefish/stonefish_added_mass.patch
  takes Strathe''s damping as it is.'
