# default_experiment.yaml -- the shipped fleet v2 experiment.
#     python run_fleet_experiment.py            (uses this file)
# Copy it and edit to run your own; every field is explained in
# fleet_experiment_schema.py and CUSTOM_EXPERIMENT.md.
#
# Two simulated BlueROV2s hold a 2 m formation, sharing their state over a
# lossy acoustic link every beacon_interval_s. Between beacons each vehicle
# predicts where its teammate is with a BELIEF MODEL -- the only thing that
# differs between the conditions below. Same true physics, same start states,
# same lost packets in every condition, so they're compared episode by episode.
schema_version: 2
name: fleet_default
policies:                       # the three shipped per-vehicle policies (training seeds);
  - {model_path: fleet_policy_seed1, algorithm: ppo}   # results pool them -- a single seed can
  - {model_path: fleet_policy_seed2, algorithm: ppo}   # over- or under-state the effect
  - {model_path: fleet_policy_seed3, algorithm: ppo}   # (see analyze_fleet_study.py)
truth_params: calibrated_parameters_fleet_truth.yaml     # the "real" vehicle both run on
beliefs:
  - calibrated        # physics model with the true vehicle's parameters
  - generic           # physics model with uncalibrated default parameters
  - last_beacon       # no prediction: teammate assumed to sit at its last beacon
  - oracle            # perfect knowledge (upper bound)
compare: {a: calibrated, b: generic}
communication:
  severities: [L2, L3a]        # 30% and 60% packet loss (see README table)
  beacon_interval_s: [1.0, 3.0] # seconds between state beacons (one result cell each)
task:
  target_separation_m: 2.0
  tolerance_m: 0.2
  hold_steps: 20               # ticks of 0.1 s
  max_episode_steps: 200
  collision_radius_m: 0.5
initial_conditions:
  separations_m: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5]
  closing_speeds_mps: [-0.7, -0.35, 0.0, 0.35, 0.7]   # + = starting to separate
evaluation:
  comm_seeds: [1, 2, 3, 4, 5]
dynamics_backend: stand_in     # stand_in | mujoco | both
output_dir: results/fleet_default
