name: fleet_baseline_sweep
vehicles:
- model_path: formation_hold_ppo_curriculum_L2
  algorithm: ppo
  role: calibrated
- model_path: formation_hold_ppo_curriculum_v5
  algorithm: ppo
  role: generic
communication:
  severity: L2
  overrides:
    near_distance_m: 0.0
    far_distance_m: 1000.0
    near_field_prob: 0.3
    far_field_prob: 0.3
    speed_of_sound_mps: 1500.0
task:
  target_separation_m: 2.0
  tolerance_m: 0.2
  hold_steps: 20
evaluation:
  episodes: 160
  comm_seeds:
  - 1
  - 2
  - 3
  - 4
  - 5
  grid_seeds: 5
dynamics_backend: stand_in
output_dir: results/fleet_baseline_sweep
