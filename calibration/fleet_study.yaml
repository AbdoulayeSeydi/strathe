# fleet_study.yaml -- the fleet v2 belief-to-success study (README, "Fleet coordination results").
# Does a more accurate teammate model -> better belief -> more successful coordination?
# Only the belief model varies between conditions; truth physics, policy, start state
# and packet losses are identical across them (paired episodes).
schema_version: 2
name: fleet_v2_belief_to_success
policies:
  - {model_path: fleet_policy_seed1, algorithm: ppo}
  - {model_path: fleet_policy_seed2, algorithm: ppo}
  - {model_path: fleet_policy_seed3, algorithm: ppo}
truth_params: calibrated_parameters_fleet_truth.yaml
beliefs:
  - oracle
  - calibrated                  # alpha = 0: model parameters equal the true vehicle's
  - {physics_alpha: 0.25}
  - {physics_alpha: 0.5}
  - {physics_alpha: 0.75}
  - generic                     # alpha = 1: vehicle_spec.yaml defaults
  - constant_velocity
  - last_beacon
compare: {a: calibrated, b: generic}
communication:
  severities: [L0, L1, L2, L3a]
  beacon_interval_s: [1.0, 3.0]
initial_conditions:
  separations_m: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5]
  closing_speeds_mps: [-0.7, -0.35, 0.0, 0.35, 0.7]
evaluation: {comm_seeds: [1, 2, 3, 4, 5], workers: 7}
dynamics_backend: stand_in
output_dir: results/fleet_v2_belief_to_success
