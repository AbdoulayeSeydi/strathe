# ci_smoke_experiment.yaml -- tiny fleet v2 run for CI (~20 s). Exercises the
# full lab entry point end to end with a shipped policy; not a source of results.
schema_version: 2
name: ci_smoke
policies: [{model_path: fleet_policy_seed1}]
beliefs: [calibrated, generic, last_beacon]
communication: {severity: L2, beacon_interval_s: 1.0}
initial_conditions: {separations_m: [2.5, 4.5], closing_speeds_mps: [-0.35, 0.35]}
evaluation: {comm_seeds: [1], workers: 1}
output_dir: results/ci_smoke
