# Ingest spec: PWM-only logs from ANY vehicle, described by where its thrusters
# are and which way they push. The layout below is a BlueROV2 Heavy, as an
# example to edit: a test checks it gives exactly the validated preset's forces.
#     python strathe.py calibrate --ingest-spec this_file.yaml --name my_vehicle
#
# One entry per thruster, in the same order as pwm_columns:
#   position_m  [x, y, z] in metres, body frame FRD (x forward, y right, z DOWN).
#               x, y: from the vehicle's centre. z: from the plane of the
#               horizontal thrusters (so they have z = 0). The physics model has
#               no drag moment, so torques are best taken about the height
#               drag acts through (PROJECT_STATUS.md #50).
#               Any point on the thruster's line of thrust gives the same result.
#   direction   [dx, dy, dz] the way the thruster pushes the VEHICLE for positive
#               thrust (need not be unit length). Pointing up is [0, 0, -1]. For ArduSub,
#               "positive thrust" is a positive motor output: the direction ArduSub's
#               own motor factors give that motor (forward, lateral = right, throttle -1
#               = pushes down); the example below follows them exactly.
#   reversed    true if the motor's command is mirrored (ArduSub
#               MOT_n_DIRECTION = -1, or a counter-rotating propeller).
# Vehicles that can't push every axis (e.g. 6 thrusters, no pitch control) are
# fine: ingestion reports which axes the thrusters can't push.

vehicle: my_vehicle
source: {files: "raw_logs/*.csv"}
time: {column: timestamp, unit: s}
resample_hz: 10
session_date: {from: filename, pattern: "(\\d{4}-\\d{2}-\\d{2})", format: "%Y-%m-%d"}
frame: frd
body_velocity:
  columns: {u: vel_x, v: vel_y, w: vel_z, p: rate_x, q: rate_y, r: rate_z}
  linear_unit: m/s
  angular_unit: rad/s
orientation:
  quaternion: {x: qx, y: qy, z: qz, w: qw}
wrench:
  thrusters:
    pwm_columns: [pwm1, pwm2, pwm3, pwm4, pwm5, pwm6, pwm7, pwm8]
    layout:                # ArduSub motor numbering; front = +x, right = +y, down = +z
      - {position_m: [0.1335, 0.1335, 0.0], direction: [-1, 1, 0], reversed: true}     # 1 front right
      - {position_m: [0.1335, -0.1335, 0.0], direction: [-1, -1, 0], reversed: true}   # 2 front left
      - {position_m: [-0.1335, 0.1335, 0.0], direction: [1, 1, 0], reversed: false}    # 3 rear right
      - {position_m: [-0.1335, -0.1335, 0.0], direction: [1, -1, 0], reversed: false}  # 4 rear left
      - {position_m: [0.12, 0.218, 0.0], direction: [0, 0, 1], reversed: true}         # 5 front right, vertical
      - {position_m: [0.12, -0.218, 0.0], direction: [0, 0, 1], reversed: false}       # 6 front left, vertical
      - {position_m: [-0.12, 0.218, 0.0], direction: [0, 0, 1], reversed: false}       # 7 rear right, vertical
      - {position_m: [-0.12, -0.218, 0.0], direction: [0, 0, 1], reversed: true}       # 8 rear left, vertical
    curve: t200            # Blue Robotics T200; or curve_csv: my_curve.csv (see thrust_curve_template.csv)
    # thrusters that differ: add curve_csv, thrust_scale (e.g. 0.5) or max_forward_n / max_reverse_n to an entry
    # commands logged normalized (e.g. -1..1) instead of microseconds: add command: normalized and
    # command_range: [-1, 1] (see ingest_csv_normalized_thrusters.yaml)
    voltage: 15.0          # T200 only: rescales the curve to your battery voltage (12-20 V); with your own
                           # curve_csv of T200s, add curve_voltage: (the voltage it was measured at). Logged battery
                           # voltage: voltage_column: battery_v scales each sample instead
