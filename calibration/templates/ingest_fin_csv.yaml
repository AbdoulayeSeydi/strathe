# Ingest spec: a FIN-STEERED vehicle's CSV logs. Read FINS.md first.
# Change the names on the right to yours, then:
#     python strathe.py calibrate --ingest-spec this_file.yaml --spec my_vehicle_spec.yaml --name my_auv
# The vehicle description says `steering: fin`: templates/vehicle_spec_fin_template.yaml.

vehicle: my_auv
source:
  files: "raw_logs/*.csv"
  delimiter: ","
time: {column: timestamp, unit: s}
resample_hz: 10
session_date: {from: constant, value: "2026-01-15"}
frame: frd
body_velocity:
  columns: {u: dvl_u, v: dvl_v, w: dvl_w, p: gyro_p, q: gyro_q, r: gyro_r}
  linear_unit: m/s
  angular_unit: rad/s
orientation:
  euler: {roll: roll, pitch: pitch, yaw: heading, unit: deg}
fins:
  source: measured             # measured: what the fins did. commanded: what they were told (the servo's lag is then applied)
  unit: deg                     # deg | rad | percent (with full_scale_deg) | pwm_us (with pwm_us_per_deg)
  channels: {rudder: rudder_deg, elevator: elevator_deg}    # or one per fin, by the name in the vehicle description
  positive_turns: starboard     # which way a positive rudder turns the vehicle: the logs are checked against this
  positive_pitches: nose_up
propeller: {column: prop_rpm, unit: rpm}
