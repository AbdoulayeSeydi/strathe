# A simulator description for `strathe fit-sim --sim external` (calibration/simulators/SIMULATOR_PROTOCOL.md).
simulator: Example sim
replay: python example_replay.py        # paths are relative to this file
model: vehicle.json
density: /water/density                 # --density-by-date writes the water density here
knobs:
  # drag: the file holds negative damping; sign -1 fits its magnitude (x1/30 to x30 of the start by default)
  - {name: quadratic_drag_x, group: drag, at: /quadratic_damping/0, sign: -1}
  - {name: quadratic_drag_y, group: drag, at: /quadratic_damping/1, sign: -1, axisym: drag_yz}
  - {name: quadratic_drag_z, group: drag, at: /quadratic_damping/2, sign: -1, axisym: drag_yz}
  - {name: added_mass_x, group: added_mass, at: /added_mass/0}
  - {name: added_mass_y, group: added_mass, at: /added_mass/1, axisym: added_mass_yz}
  - {name: added_mass_z, group: added_mass, at: /added_mass/2, axisym: added_mass_yz}
export:
  # where Strathe's calibrated values go (export-sim, fit-sim --from-strathe): file value = scale x value + offset
  - {param: Xu, at: /linear_damping/0}
  - {param: Yv, at: /linear_damping/1}
  - {param: Zw, at: /linear_damping/2}
  - {param: Kp, at: /linear_damping/3}
  - {param: Mq, at: /linear_damping/4}
  - {param: Nr, at: /linear_damping/5}
  - {param: Xuu, at: /quadratic_damping/0}
  - {param: Yvv, at: /quadratic_damping/1}
  - {param: Zww, at: /quadratic_damping/2}
  - {param: Kpp, at: /quadratic_damping/3}
  - {param: Mqq, at: /quadratic_damping/4}
  - {param: Nrr, at: /quadratic_damping/5}
  - {param: Xu_dot, at: /added_mass/0}
  - {param: Yv_dot, at: /added_mass/1}
  - {param: Zw_dot, at: /added_mass/2}
  - {param: Ieff_roll, at: /inertia/0}
  - {param: Ieff_pitch, at: /inertia/1}
  - {param: Ieff_yaw, at: /inertia/2}
  - {param: mass, at: /mass}
